<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển Đổi Link Shopee </title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { background: #ee4d2d; color: white; padding: 12px 24px; border: none; cursor: pointer; font-size: 16px; }
        button:hover { background: #d9361f; }
        #result { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 5px; word-break: break-all; }
    </style>
</head>
<body>
    <h1>Chuyển Đổi Link Shopee </h1>
    <p>Dán link Shopee vào ô dưới, nhấn "Chuyển Đổi" để nhận mã. </p>
    
    <input type="url" id="inputLink" placeholder="Dán link Shopee gốc (ví dụ: https://shopee.vn/... hoặc link FB)" required>
    <br>
    <button onclick="convertLink()">Chuyển Đổi & Mở Link</button>
    
    <div id="result"></div>

    <script>
        function convertLink() {
            const input = document.getElementById('inputLink').value.trim();
            if (!input) {
                alert('Vui lòng dán link!');
                return;
            }

            // ID tracking cố định
            const trackingId = '17314740041';
            
            // Thêm tham số sp_atk nếu chưa có (tracking affiliate Shopee)
            let newUrl = input;
            const url = new URL(input, 'https://shopee.vn');  // Force base nếu không có
            if (!url.searchParams.has('sp_atk')) {
                url.searchParams.set('sp_atk', trackingId);
            }
            newUrl = url.toString();

            // Hiển thị kết quả
            const result = document.getElementById('result');
            result.innerHTML = `
                <strong>Link đã chuyển đổi:</strong><br>
                ${newUrl}<br><br>
                <small>Đã thêm sp_atk=${trackingId} để tracking từ FB. Nhấn F5 để thử lại.</small>
            `;

            // Tự động mở link mới (conversion sang Shopee)
            if (confirm('Mở link Shopee đã tracking?')) {
                window.open(newUrl, '_blank');
            }
        }
    </script>
</body>
</html>
