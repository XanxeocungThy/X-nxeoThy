<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển Đổi Link Shopee </title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { padding: 12px 24px; border: none; cursor: pointer; font-size: 16px; margin: 5px; border-radius: 5px; }
        #convertBtn { background: #ee4d2d; color: white; }
        #convertBtn:hover { background: #d9361f; }
        #copyBtn { background: #28a745; color: white; }
        #copyBtn:hover { background: #218838; }
        #copyBtn.success { background: #17a2b8; }
        #result { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 5px; word-break: break-all; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>Chuyển Đổi Link Shopee </h1>
    <p>Dán link từ Shopee vào ô dưới, nhấn "Chuyển Đổi" để lấy mã </p>
    
    <input type="url" id="inputLink" placeholder="Dán link Shopee gốc (ví dụ: https://shopee.vn/...)" required>
    <br>
    <button id="convertBtn" onclick="convertLink()">Chuyển Đổi</button>
    <button id="copyBtn" class="hidden" onclick="copyLink()">Sao chép</button>
    
    <div id="result" class="hidden"></div>

    <script>
        let convertedUrl = '';

        async function copyLink() {
            if (!convertedUrl) return;
            try {
                await navigator.clipboard.writeText(convertedUrl);
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.textContent = 'Đã sao chép!';
                copyBtn.classList.add('success');
                setTimeout(() => {
                    copyBtn.textContent = 'Sao chép';
                    copyBtn.classList.remove('success');
                }, 2000);
            } catch (err) {
                alert('Không thể sao chép: ' + err);
            }
        }

        function convertLink() {
            const input = document.getElementById('inputLink').value.trim();
            if (!input) {
                alert('Vui lòng dán link!');
                return;
            }

            const trackingId = '17314740041';
            let newUrl = input;
            const url = new URL(input, 'https://shopee.vn');
            if (!url.searchParams.has('sp_atk')) {
                url.searchParams.set('sp_atk', trackingId);
            }
            convertedUrl = newUrl = url.toString();

            const result = document.getElementById('result');
            result.innerHTML = `
                <strong>Link đã chuyển đổi:</strong><br>
                ${newUrl}<br><br>
                <small>Đã chuyển .</small>
            `;
            result.classList.remove('hidden');

            const copyBtn = document.getElementById('copyBtn');
            copyBtn.classList.remove('hidden');
        }
    </script>
</body>
</html>
